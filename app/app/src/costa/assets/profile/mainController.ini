;curves and tables
    tpswot_tps = "Define o TPS% que e considerado aceleracao maxima com base em RPM.\n.e. em RPMs baixos, a aceleracao parcial fluira o mesmo ar que a aceleracao maxima. Em RPMs maximos, a aceleracao maxima e necessaria para o fluxo de ar total.\nQuando o acelerador esta em ou alem do novo 'acelerador maximo', ele e considerado aceleracao de 100%. Isso tem o efeito de tornar o enriquecimento de aceleracao baseado em TPS mais sensivel em aberturas de aceleracao mais baixas em RPMs mais baixas e tambem evita o enriquecimento de aceleracao de TPS se o acelerador ja estiver 'totalmente aberto.'"
    idle_voltage_comp_delta = "Algumas valvulas ociosas PWM de 2 fios operarao de forma diferente dependendo da tensao do sistema. Isso permite que uma compensacao seja aplicada para permitir essa diferenca.\nNormalmente, em tensoes mais baixas, a valvula precisara de um pouco mais de trabalho (numero positivo) e em tensoes mais altas, precisara de menos trabalho (numero negativo)."
    maeBins = "A curva especifica um adicionador de largura de pulso de combustivel ms com base na taxa de mudanca de MAP (MAP Dot)\nIsso faz parte do esquema basico de enriquecimento de aceleracao baseado em tempo. Mudancas maiores em MAP exigem mais combustivel adicionado."
    taeBins = "A curva especifica um adicionador de largura de pulso de combustivel ms com base na taxa de mudanca de TPS (TPS Dot)\nIsso faz parte do esquema basico de enriquecimento de aceleracao baseado em tempo. Mudancas maiores em TPS exigem mais combustivel adicionado."
    knock_thresholds = "Sets an allowable knock level before retard is triggered.\nThe numbers here are highly engine dependent."
    primePWTable = "Primeiro pulso de partida refere-se a jogar combustivel na admissao de forma que o motor tenha logo o que queimar em uma partida com motor frio ou quente, colocar o valor em 0 intefere em cortar a bomba de combustivel tambem."
    crankPctTable = "Esta tabela de porcentagem controla o combustivel injetado quando o motor esta dando partida. A maioria dos motores precisa de 200-400% quando frio e perto de 100% quando quente.\n(E uma porcentagem de ReqFuel, entao se voce trocar os injetores, esta curva pode ser deixada sozinha.)"
    asePctTable = "Imediatamente apos o motor ter ligado, e normal precisar de combustivel adicional. Esta curva especifica quanto adicionar. (5-50%)"
    aseCntTable = "Especifica por quanto tempo (em ciclos do motor ou segundos) aplicar o enriquecimento pos-partida."
    wueBins = "Especifica o multiplicador percentual para combustivel durante o aquecimento. Em temperaturas frias, 200-300% podem ser necessarios. Em totalmente aquecido (ultima linha na tabela), 100% DEVE ser especificado."
    mafflow = "Cruva de calibracao e ajuste de tensao em V para o fluxo de ar admitido na MAF."
    dwellcorr = "Especifica o ajuste percentual para a permanencia nominal com base na tensao da bateria.\nBobinas indutivas exigem maior permanencia (tempo de carga) em tensoes mais baixas."
    cold_adv_table = "Essa curva permite, opcionalmente, que o tempo de ignicao seja antecipado durante o aquecimento.\n Por outro lado, alguns motores podem preferir o retardo durante o aquecimento para pre-aquecer o conversor catalitico."
    iacstepTable = "Especifica aabertura do Atuador de Lenta PWM durante o aquecimento de temperatura de arrefecimento.\nQuando maior valor, maior a abertura.\nQuanto menor o valor, menor a abertura."
    ipwmTable = "Especifica aabertura do Atuador de Lenta PWM durante o aquecimento de temperatura de arrefecimento.\nQuando maior valor, maior a abertura.\nQuanto menor o valor, menor a abertura."
    matRetard = "Permite que o tempo de ignicao seja retardado com base na temperatura de admissao. Isso e principalmente para instalacoes de inducao forcada onde ha aquecimento de carga."
    baroCorrDelta = "Ha duas maneiras de usar a correcao barometrica.\n\n1. A maneira atual. Na pagina MAP/Baro, os numeros 'No vacuo total' e 'Avaliacao' devem ser definidos como zero. Esta curva e entao normalmente 100% em todos os pontos e ajustada para cima ou para baixo para alterar o abastecimento com base na leitura do barometro.\n\n2. A maneira antiga. Os dois numeros sao definidos como 147 e -47 e a curva e normalmente 0% em todos os pontos."
    matCorrDelta2 =  "Esta curva e toda a correcao da densidade do ar exposta na integra. Ela e baseada na 'lei dos gases ideais' e normalmente varia entre 125% frio e 75% quente."
    matCorrDelta = "Permite pequenas correcoes no abastecimento com base na Temperatura do Ar (MAT) ao usar MAF para controlar o abastecimento. A curva padrao e 0%, o que significa nenhuma correcao."
    EAEAWN = "Esta curva modifica a curva EAE Aderencia a Parede. Ela permite que a quantidade de correcao especificada pela curva EAE Aderencia a Parede seja aumentada ou diminuida com base no RPM."
    EAEAWW = "Esta curva modifica a curva EAE Aderencia a Parede. Ela permite que a quantidade de correcao especificada pela curva EAE Aderencia a Parede seja aumentada ou diminuida com base na Temperatura de Arrefecimento"
    EAEBAWC = "Esta curva determina quanto combustivel e adicionado as paredes da porta em caso de injecao. E uma porcentagem (eixo Y) de cada evento de injecao com base na carga (eixo X)."
    EAEBSOC = "Esta curva determina quanto combustivel esta sendo sugado das paredes em cada evento de admissao (valvula aberta). E uma porcentagem (eixo Y) da quantidade total de combustivel que aderiu as paredes com base na carga (eixo X), portanto, as porcentagens sao muito menores (cerca de 10x menores) do que os coeficientes de aderencia as paredes."
    EAESON = "Esta curva modifica a curva EAE Succao de Parede. Ela permite que a quantidade de correcao especificada pela curva EAE Succao de Parede seja aumentada ou diminuida com base no RPM."
    EAESOW = "Esta curva modifica a curva EAE Succao de Parede. Ela permite que a quantidade de correcao especificada pela curva EAE Succao de Parede seja aumentada ou diminuida com base na Temperatura de Arrefecimento."
    NoiseFilterLen = "A duracao do filtro de ruido depende do RPM. Seu objetivo e filtrar breves picos de ruido na entrada da rotacao. As configuracoes aqui dependem do modo da roda e sao especificas do motor. Definir o periodo do filtro muito alto filtrara os dentes reais.\nExemplos\n36-1, 60-2: 500 rpm = 200 us, 7500 rpm = 13\nGatilho basico da rotacao: 500 rpm = 1800 us, 7500 rpm = 120 us"
    idleadvance_curve = "Define o tempo em relacao a carga do motor ou RPM ou Adaptativo quando o Avanco em marcha lenta esta ativo.\nCarga: Normalmente, a curva aumentara de baixo avanco em carga baixa para mais avanco em cargas mais altas para estabilizar a marcha lenta.\nRPM: Normalmente, a curva aumentara de maior avanco em RPMs mais baixas para menos avanco em RPMs mais altas para estabilizar a marcha lenta.\nAdaptativo: Normalmente, a curva aumentara de maior avanco em deltas de RPM negativos (abaixo da meta) para menor avanco em deltas de RPM positivos (acima da meta) para ajudar a estabilizar a marcha lenta."
    pwmidle_target_rpms = "Alvo de rotacao por temperatura em malha fechada.\n Usa-se uma rotacao mais alta em baixa temperatura, em alta temperatura usa-se uma rotacao mais baixa."
    RevLimRpm1 = "Curva de ajuste da temperatura X rotacao, nessa curva voce consegue criar metodos de protecao por temperatura de arreficmento."
    pwmidle_crank_dutyorsteps_duty = "A posicao do atuador de marcha lenta durante a partida. Ela deve ser ajustada alta o suficiente para que o motor possa dar partida sem tocar no acelerador quando frio, mas nao tao alta que o motor acelere muito imediatamente apos a partida."
    pwmidle_crank_dutyorsteps_steps = "A posicao do atuador de marcha lenta durante a partida. Ela deve ser ajustada alta o suficiente para que o motor possa dar partida sem tocar no acelerador quando frio, mas nao tao alta que o motor acelere muito imediatamente apos a partida."
    ITB_load_loadvals = "Esta curva e usada para alocar os compartimentos na tabela VE para ajuste de Densidade do ar ou TPS. A area da tabela VE abaixo do valor de carga da curva sera usada para ajuste de Densidade do ar e a area acima da curva sera usada para ajuste de TPS.\nAlterar esta curva exigira que a tabela VE seja reajustada."
    ITB_load_switchpoints = "Esta curva define o valor TPS onde a carga MAP atinge o ponto de transformacao % MAP. Esta curva sera diferente para cada motor e deve ser configurada usando valores obtidos de arquivos de log do seu motor. Definir esta curva e uma parte importante do modo ITB.\nAlterar esta curva exigira que a tabela VE seja reajustada."
